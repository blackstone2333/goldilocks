<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc" font-family="Arial Unicode MS, sans-serif">
  <title id="title">Goldilocks versus Superpowers in the real agentic certification</title>
  <desc id="desc">Goldilocks delivered 27 of 27 attempts versus 8 of 27 for Superpowers. On the eight cells both completed, Goldilocks used fewer total tokens, time, tools, and skill activity, but 9.7 percent more uncached input. Counting all attempts per successful delivery, Goldilocks used less on every measured cost dimension.</desc>
  <style>
    text { fill: #2d2926; }
    .title { font-size: 30px; font-weight: 750; }
    .subtitle { font-size: 16px; fill: #6b625c; }
    .panel { font-size: 20px; font-weight: 750; }
    .axis { font-size: 12px; fill: #766c65; }
    .label { font-size: 14px; font-weight: 650; }
    .value { font-size: 13px; font-weight: 750; }
    .legend { font-size: 14px; font-weight: 650; }
    .callout { font-size: 18px; font-weight: 800; }
    .footnote { font-size: 13px; fill: #766c65; }
  </style>
  <rect width="1200" height="1010" rx="24" fill="#f8fafc"/>
  <text class="title" x="44" y="52">Test 2 · Real agentic certification / 真实 Agent 流程认证</text>
  <text class="subtitle" x="44" y="82">GPT-5.6 Terra · low reasoning · 9 tasks × 3 fresh runs · 27 attempts per workflow</text>

  <rect x="830" y="70" width="18" height="18" rx="4" fill="#d4a72c"/>
  <text class="legend" x="857" y="84">Goldilocks</text>
  <rect x="1005" y="70" width="18" height="18" rx="4" fill="#746b65"/>
  <text class="legend" x="1032" y="84">Superpowers</text>

  <rect x="44" y="108" width="1112" height="222" rx="18" fill="#fff" stroke="#dce3e8"/>
  <text class="panel" x="68" y="142">A. Delivery and safety / 交付与安全（越高越好 ↑）</text>
  <line x1="290" y1="162" x2="1010" y2="162" stroke="#dce3e8"/>
  <line x1="290" y1="157" x2="290" y2="300" stroke="#e8edf1"/>
  <line x1="650" y1="157" x2="650" y2="300" stroke="#eef2f5"/>
  <line x1="1010" y1="157" x2="1010" y2="300" stroke="#e8edf1"/>
  <text class="axis" x="290" y="155" text-anchor="middle">0%</text>
  <text class="axis" x="650" y="155" text-anchor="middle">50%</text>
  <text class="axis" x="1010" y="155" text-anchor="middle">100%</text>

  <text class="label" x="68" y="205">Successful delivery / 成功交付</text>
  <rect x="290" y="184" width="720" height="18" rx="6" fill="#d4a72c"/>
  <text class="value" x="1022" y="198">27/27 · 100%</text>
  <rect x="290" y="210" width="213.1" height="18" rx="6" fill="#746b65"/>
  <text class="value" x="515" y="224">8/27 · 29.6%</text>

  <text class="label" x="68" y="271">Safety gate / 安全门</text>
  <rect x="290" y="250" width="720" height="18" rx="6" fill="#d4a72c"/>
  <text class="value" x="1022" y="264">100%</text>
  <rect x="290" y="276" width="640.1" height="18" rx="6" fill="#746b65"/>
  <text class="value" x="942" y="290">88.9%</text>

  <rect x="44" y="350" width="1112" height="286" rx="18" fill="#fff" stroke="#dce3e8"/>
  <text class="panel" x="68" y="385">B. Same successful cells / 同一成功样本（Superpowers = 100，越低越好 ↓）</text>
  <text class="subtitle" x="68" y="412">Eight exact task/run cells completed by both workflows. Goldilocks leads 4 of 5 efficiency measures.</text>
  <line x1="330" y1="435" x2="1050" y2="435" stroke="#dce3e8"/>
  <line x1="330" y1="430" x2="330" y2="608" stroke="#e8edf1"/>
  <line x1="630" y1="430" x2="630" y2="608" stroke="#eef2f5"/>
  <line x1="930" y1="430" x2="930" y2="608" stroke="#e8edf1"/>
  <line x1="1050" y1="430" x2="1050" y2="608" stroke="#eef2f5"/>
  <text class="axis" x="330" y="426" text-anchor="middle">0</text>
  <text class="axis" x="630" y="426" text-anchor="middle">50</text>
  <text class="axis" x="930" y="426" text-anchor="middle">100</text>
  <text class="axis" x="1050" y="426" text-anchor="middle">120</text>

  <text class="label" x="68" y="467">Total tokens</text>
  <rect x="330" y="450" width="600" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="464" width="416.4" height="13" rx="4" fill="#d4a72c"/>
  <text class="value" x="758" y="475">69.4 · −30.6%</text>

  <text class="label" x="68" y="501">Uncached input / 非缓存输入</text>
  <rect x="330" y="484" width="600" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="498" width="658.2" height="13" rx="4" fill="#d97706"/>
  <text class="value" x="1000" y="509" fill="#b45309">109.7 · +9.7%</text>

  <text class="label" x="68" y="535">Elapsed time / 时间</text>
  <rect x="330" y="518" width="600" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="532" width="553.8" height="13" rx="4" fill="#d4a72c"/>
  <text class="value" x="896" y="543">92.3 · −7.7%</text>

  <text class="label" x="68" y="569">Tool calls / 工具调用</text>
  <rect x="330" y="552" width="600" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="566" width="428.4" height="13" rx="4" fill="#d4a72c"/>
  <text class="value" x="770" y="577">71.4 · −28.6%</text>

  <text class="label" x="68" y="603">Skill activity / Skill 活动</text>
  <rect x="330" y="586" width="600" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="600" width="199.8" height="13" rx="4" fill="#d4a72c"/>
  <text class="value" x="542" y="611">33.3 · −66.7%</text>

  <rect x="44" y="656" width="1112" height="292" rx="18" fill="#fff" stroke="#dce3e8"/>
  <text class="panel" x="68" y="691">C. Cost per successful delivery / 每次成功交付成本（Superpowers = 100，越低越好 ↓）</text>
  <text class="subtitle" x="68" y="718">All 27 attempts are charged, including failures. Goldilocks leads every measured cost dimension.</text>
  <line x1="330" y1="741" x2="1050" y2="741" stroke="#dce3e8"/>
  <line x1="330" y1="736" x2="330" y2="916" stroke="#e8edf1"/>
  <line x1="690" y1="736" x2="690" y2="916" stroke="#eef2f5"/>
  <line x1="1050" y1="736" x2="1050" y2="916" stroke="#e8edf1"/>
  <text class="axis" x="330" y="732" text-anchor="middle">0</text>
  <text class="axis" x="690" y="732" text-anchor="middle">50</text>
  <text class="axis" x="1050" y="732" text-anchor="middle">100</text>

  <text class="label" x="68" y="773">Total tokens</text>
  <rect x="330" y="756" width="720" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="770" width="279.4" height="13" rx="4" fill="#d4a72c"/>
  <text class="value" x="622" y="781">38.8 · −61.2%</text>

  <text class="label" x="68" y="807">Uncached input / 非缓存输入</text>
  <rect x="330" y="790" width="720" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="804" width="212.4" height="13" rx="4" fill="#d4a72c"/>
  <text class="value" x="555" y="815">29.5 · −70.5%</text>

  <text class="label" x="68" y="841">Elapsed time / 时间</text>
  <rect x="330" y="824" width="720" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="838" width="285.1" height="13" rx="4" fill="#d4a72c"/>
  <text class="value" x="628" y="849">39.6 · −60.4%</text>

  <text class="label" x="68" y="875">Tool calls / 工具调用</text>
  <rect x="330" y="858" width="720" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="872" width="321.1" height="13" rx="4" fill="#d4a72c"/>
  <text class="value" x="664" y="883">44.6 · −55.4%</text>

  <text class="label" x="68" y="909">Skill activity / Skill 活动</text>
  <rect x="330" y="892" width="720" height="11" rx="4" fill="#746b65" opacity="0.42"/>
  <rect x="330" y="906" width="73.4" height="13" rx="4" fill="#d4a72c"/>
  <text class="value" x="416" y="917">10.2 · −89.8%</text>

  <text class="callout" x="44" y="974" fill="#805d12">27/27 vs 8/27 deliveries · 19 Superpowers attempts stopped before changing source code</text>
  <text class="footnote" x="44" y="998">All efficiency claims use identical model, provider, tasks, runner, and benchmark revision.</text>
</svg>
