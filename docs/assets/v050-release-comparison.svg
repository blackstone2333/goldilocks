<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title description">
  <title id="title">Goldilocks v0.5.0 release aggregate: absolute metrics</title>
  <desc id="description">A frozen three-task aggregate matrix compares four approaches across elapsed time, raw tokens, and normalized cost. Each metric column uses its own true linear scale; lower is better and labels are exact absolute totals.</desc>
  <style>
    .surface { fill: #f6f8fa; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .subtitle { fill: #57606a; font: 400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .head { fill: #1f2328; font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .scale { fill: #57606a; font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .row { fill: #1f2328; font: 600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .value { fill: #1f2328; font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .inverse { fill: #ffffff; }
    .track { fill: #eaeef2; }
    .rule { stroke: #d0d7de; stroke-width: 1; }
    .time { fill: #0969da; }
    .token { fill: #8250df; }
    .cost { fill: #1a7f37; }
    .note { fill: #57606a; font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  </style>
  <rect class="surface" x="0.5" y="0.5" width="1399" height="699" rx="12"/>
  <text class="title" x="56" y="62">v0.5.0 release aggregate — absolute metrics</text>
  <text class="subtitle" x="56" y="92">Frozen three-task aggregate · Lower is better · True linear scale · Exact labels are absolute totals</text>

  <text class="head" x="350" y="150">Elapsed</text>
  <text class="scale" x="350" y="173">0 — 7,402.714 s</text>
  <text class="head" x="690" y="150">Raw Token</text>
  <text class="scale" x="690" y="173">0 — 29,059,764</text>
  <text class="head" x="1030" y="150">Normalized cost</text>
  <text class="scale" x="1030" y="173">0 — $25.360443</text>
  <line class="rule" x1="56" y1="190" x2="1344" y2="190"/>

  <text class="row" x="56" y="233">Goldilocks v0.5.0</text>
  <rect class="track" x="350" y="210" width="280" height="30" rx="5"/>
  <rect class="time" x="350" y="210" width="46.27" height="30" rx="5"/>
  <text class="value" x="404" y="231">1,223.291 s</text>
  <rect class="track" x="690" y="210" width="280" height="30" rx="5"/>
  <rect class="token" x="690" y="210" width="15.35" height="30" rx="5"/>
  <text class="value" x="713" y="231">1,593,503</text>
  <rect class="track" x="1030" y="210" width="300" height="30" rx="5"/>
  <rect class="cost" x="1030" y="210" width="34.89" height="30" rx="5"/>
  <text class="value" x="1073" y="231">$2.949584</text>

  <line class="rule" x1="56" y1="270" x2="1344" y2="270"/>
  <text class="row" x="56" y="313">Goldilocks v0.4.2</text>
  <rect class="track" x="350" y="290" width="280" height="30" rx="5"/>
  <rect class="time" x="350" y="290" width="52.94" height="30" rx="5"/>
  <text class="value" x="411" y="311">1,399.565 s</text>
  <rect class="track" x="690" y="290" width="280" height="30" rx="5"/>
  <rect class="token" x="690" y="290" width="32.44" height="30" rx="5"/>
  <text class="value" x="731" y="311">3,367,113</text>
  <rect class="track" x="1030" y="290" width="300" height="30" rx="5"/>
  <rect class="cost" x="1030" y="290" width="52.38" height="30" rx="5"/>
  <text class="value" x="1091" y="311">$4.427797</text>

  <line class="rule" x1="56" y1="350" x2="1344" y2="350"/>
  <text class="row" x="56" y="393">Direct</text>
  <rect class="track" x="350" y="370" width="280" height="30" rx="5"/>
  <rect class="time" x="350" y="370" width="33.82" height="30" rx="5"/>
  <text class="value" x="392" y="391">894.252 s</text>
  <rect class="track" x="690" y="370" width="280" height="30" rx="5"/>
  <rect class="token" x="690" y="370" width="15.70" height="30" rx="5"/>
  <text class="value" x="714" y="391">1,629,009</text>
  <rect class="track" x="1030" y="370" width="300" height="30" rx="5"/>
  <rect class="cost" x="1030" y="370" width="40.42" height="30" rx="5"/>
  <text class="value" x="1079" y="391">$3.416688</text>

  <line class="rule" x1="56" y1="430" x2="1344" y2="430"/>
  <text class="row" x="56" y="473">Superpowers 6.1.1</text>
  <rect class="track" x="350" y="450" width="280" height="30" rx="5"/>
  <rect class="time" x="350" y="450" width="280" height="30" rx="5"/>
  <text class="value inverse" x="621" y="471" text-anchor="end">7,402.714 s</text>
  <rect class="track" x="690" y="450" width="280" height="30" rx="5"/>
  <rect class="token" x="690" y="450" width="280" height="30" rx="5"/>
  <text class="value inverse" x="961" y="471" text-anchor="end">29,059,764</text>
  <rect class="track" x="1030" y="450" width="300" height="30" rx="5"/>
  <rect class="cost" x="1030" y="450" width="300" height="30" rx="5"/>
  <text class="value inverse" x="1321" y="471" text-anchor="end">$25.360443</text>

  <line class="rule" x1="56" y1="514" x2="1344" y2="514"/>
  <text class="note" x="56" y="550">Each metric uses its own true linear scale: value / column max; compare within columns only.</text>
  <text class="note" x="56" y="579">Exact labels are absolute totals. Normalized cost includes a Luna-equivalent proxy for Spark; it is an authorization-normalized estimate, not an invoice.</text>
  <text class="note" x="56" y="624">Method note: frozen three-task aggregate. These results are descriptive, not a general performance guarantee.</text>
</svg>
